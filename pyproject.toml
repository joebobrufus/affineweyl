[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "affineweyl"
version = "0.1.0"
description = "Affine Weyl groups (untwisted) via the semidirect product W ⋉ Q∨"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mark Shimozono" }]
keywords = ["affine", "Weyl", "Coxeter", "Lie", "root system"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
affineweyl = "affineweyl.cli:main"

[project.urls]
Homepage = "https://github.com/local/affineweyl"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
